<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя | Find&Go</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="/img/logo.png">
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: var(--bs-body-bg); transition: 0.3s; padding-top: 70px; }
        .navbar { background: var(--bs-tertiary-bg); backdrop-filter: blur(15px); }
        .profile-header { background: var(--primary-gradient); padding: 80px 0 120px; color: white; border-radius: 0 0 50px 50px; margin-bottom: -80px; }
        .profile-card { background: var(--bs-card-bg); border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); border: 1px solid var(--bs-border-color); padding: 30px; margin-bottom: 30px; transition: 0.3s; }
        .avatar-container { position: relative; width: 150px; height: 150px; margin: 0 auto 20px; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 6px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        [data-bs-theme="dark"] .avatar-img { border-color: #2b3035; }
        .rating-badge { background: #f59e0b; color: white; padding: 8px 20px; border-radius: 50px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; font-size: 1.1rem; }
        .review-card { background: var(--bs-tertiary-bg); border-radius: 24px; padding: 24px; margin-bottom: 16px; border: 1px solid var(--bs-border-color); transition: 0.3s; }
        .review-card:hover { transform: scale(1.01); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .review-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .interest-tag { background: rgba(102, 126, 234, 0.1); color: #667eea; padding: 8px 20px; border-radius: 50px; font-size: 0.9rem; font-weight: 600; margin: 6px; display: inline-block; }
        [data-bs-theme="dark"] .interest-tag { background: rgba(102, 126, 234, 0.2); color: #a5b4fc; }
        .btn-action { border-radius: 50px; padding: 14px 36px; font-weight: 600; transition: 0.3s; }
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .fact-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; padding: 16px; background: var(--bs-tertiary-bg); border-radius: 16px; border: 1px solid var(--bs-border-color); }
        .fact-icon { color: #667eea; font-size: 1.2rem; }
        .organizer-badge { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 8px 20px; border-radius: 50px; font-weight: 700; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="/app.html">
            <img src="/img/logo.png" alt="Find&Go" width="45" height="45" class="d-inline-block align-top me-2" style="border-radius: 6px;">
            <span style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent;">Find&Go</span>
        </a>
        <div class="ms-auto">
            <a href="/app.html" class="btn btn-outline-primary rounded-pill px-4"><i class="bi bi-house-door"></i> На главную</a>
        </div>
    </div>
</nav>

<div class="profile-header text-center">
    <div class="container">
        <h1 class="fw-black display-5 mb-2">Знакомьтесь!</h1>
        <p class="opacity-75 fs-5">Посмотрите профиль будущего друга</p>
    </div>
</div>

<div class="container" style="position: relative; z-index: 10;">
    <div class="row">
        <div class="col-lg-4">
            <div class="profile-card text-center">
                <div class="avatar-container">
                    <img id="userAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=loading" class="avatar-img" alt="Аватар">
                </div>
                <h2 id="userName" class="fw-bold mb-1">Загрузка...</h2>
                <div id="userRating" class="mb-2"></div>
                <div id="organizerBadge" class="mb-4"></div>
                
                <h6 class="text-uppercase text-muted small fw-bold mb-3">Интересы</h6>
                <div id="userInterests" class="mb-4"></div>
                
                <button class="btn btn-primary btn-action w-100 mb-2" id="msgBtn"><i class="bi bi-chat-fill me-2"></i> Написать сообщение</button>
                <button class="btn btn-outline-danger btn-action w-100" id="reportBtn" data-bs-toggle="modal" data-bs-target="#reportModal"><i class="bi bi-flag me-2"></i> Пожаловаться</button>
            </div>
            
            <div class="profile-card">
                <h5 class="fw-bold mb-4"><i class="bi bi-patch-check-fill text-primary"></i> Немного о себе</h5>
                <div id="userFacts"></div>
            </div>
        </div>
        
        <div class="col-lg-8">
            <div class="profile-card h-100">
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <h4 class="fw-bold mb-0 d-flex align-items-center gap-3">
                        <i class="bi bi-chat-left-heart-fill text-danger"></i> Отзывы участников
                    </h4>
                    <span id="totalReviews" class="badge bg-primary rounded-pill px-3 py-2 fs-6">0</span>
                </div>
                <div id="reviewsList">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3 text-muted">Загружаем отзывы...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Report Modal -->
<div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:20px;">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="reportModalLabel"><i class="bi bi-flag text-danger me-2"></i>Пожаловаться на пользователя</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="reportSuccess" class="alert alert-success d-none">✅ Спасибо. Жалоба отправлена модератору.</div>
        <div id="reportError" class="alert alert-danger d-none"></div>
        <p class="text-muted small mb-3">Выберите причину жалобы:</p>
        <div class="d-flex flex-column gap-2" id="reasonList">
          <label class="d-flex align-items-center gap-2 p-2 rounded-3 border" style="cursor:pointer;">
            <input type="radio" name="reportReason" value="Подозрительное поведение"> Подозрительное поведение
          </label>
          <label class="d-flex align-items-center gap-2 p-2 rounded-3 border" style="cursor:pointer;">
            <input type="radio" name="reportReason" value="Домогательства"> Домогательства
          </label>
          <label class="d-flex align-items-center gap-2 p-2 rounded-3 border" style="cursor:pointer;">
            <input type="radio" name="reportReason" value="Спам"> Спам
          </label>
          <label class="d-flex align-items-center gap-2 p-2 rounded-3 border" style="cursor:pointer;">
            <input type="radio" name="reportReason" value="Фейковый профиль"> Фейковый профиль
          </label>
          <label class="d-flex align-items-center gap-2 p-2 rounded-3 border" style="cursor:pointer;">
            <input type="radio" name="reportReason" value="Другое" id="reasonOther"> Другое
          </label>
        </div>
        <div id="otherDescriptionBlock" class="mt-3 d-none">
          <textarea id="otherDescription" class="form-control" rows="3" placeholder="Опишите причину подробнее..."></textarea>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-danger rounded-pill px-4" id="submitReportBtn"><i class="bi bi-send me-1"></i> Отправить</button>
      </div>
    </div>
  </div>
</div>
<script>
    const token = localStorage.getItem('token');
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');

    if (!token) window.location.href = '/login.html';
    if (!userId) window.location.href = '/app.html';

    async function loadUserProfile() {
        try {
            const res = await fetch(`/api/auth/users/${userId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const u = await res.json();

            if (!res.ok) throw new Error(u.message);

            document.title = `${u.name} | Профиль Find&Go`;
            document.getElementById('userName').textContent = u.name;
            document.getElementById('userAvatar').src = u.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${u.name || u.id}`;
            
            // Рейтинг
            if (u.avgRating && u.avgRating > 0) {
                document.getElementById('userRating').innerHTML = `
                    <div class="rating-badge">
                        <i class="bi bi-star-fill"></i> ${u.avgRating}
                    </div>
                    <div class="small text-muted mt-2">${u.totalReviews} отзывов от участников</div>
                `;
                document.getElementById('totalReviews').textContent = u.totalReviews;
            } else {
                document.getElementById('userRating').innerHTML = '<div class="badge bg-secondary-subtle text-secondary px-3 py-2 rounded-pill mt-2">Нет оценок</div>';
                document.getElementById('totalReviews').textContent = '0';
            }

            // Бейдж организатора
            if (u.organizedEventsCount > 0) {
                document.getElementById('organizerBadge').innerHTML = `
                    <div class="organizer-badge">
                        <i class="bi bi-trophy-fill"></i>
                        ${u.organizedEventsCount} ${u.organizedEventsCount === 1 ? 'поход организован' : u.organizedEventsCount < 5 ? 'похода организовано' : 'походов организовано'}
                    </div>
                `;
            } else {
                document.getElementById('organizerBadge').innerHTML = '';
            }

            // Интересы
            const interests = Array.isArray(u.interests) ? u.interests : [];
            if (interests.length) {
                document.getElementById('userInterests').innerHTML = interests.map(i => `<span class="interest-tag">${i}</span>`).join('');
            } else {
                document.getElementById('userInterests').innerHTML = '<p class="text-muted small">Интересы не указаны</p>';
            }

            // Факты
            let factsHtml = '';
            try {
                if (u.bio) {
                    const bioData = JSON.parse(u.bio);
                    if (bioData.fact1) factsHtml += `<div class="fact-item"><i class="bi bi-check2-circle fact-icon"></i><div>${bioData.fact1}</div></div>`;
                    if (bioData.fact2) factsHtml += `<div class="fact-item"><i class="bi bi-check2-circle fact-icon"></i><div>${bioData.fact2}</div></div>`;
                }
            } catch(e) {
                if (u.bio) factsHtml = `<div class="fact-item"><i class="bi bi-quote fact-icon"></i><div>${u.bio}</div></div>`;
            }
            document.getElementById('userFacts').innerHTML = factsHtml || '<p class="text-muted text-center py-4">Пользователь скромничает и пока ничего не рассказал</p>';

            // Отзывы
            if (!u.reviews || u.reviews.length === 0) {
                document.getElementById('reviewsList').innerHTML = '<div class="text-center py-5 text-muted bg-body-tertiary rounded-4 mt-4"><i class="bi bi-chat-dots fs-1 mb-3 d-block opacity-25"></i><p class="mb-0">Этот пользователь еще не получал отзывов.</p><p class="small">Будьте первым, кто сходит с ним в поход!</p></div>';
            } else {
                document.getElementById('reviewsList').innerHTML = u.reviews.map(r => `
                    <div class="review-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="d-flex align-items-center gap-3">
                                <img src="${r.fromUser.avatar}" class="review-avatar" alt="${r.fromUser.name}">
                                <div>
                                    <div class="fw-bold">${r.fromUser.name}</div>
                                    <div class="text-warning small">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
                                </div>
                            </div>
                            <small class="text-muted bg-body-tertiary px-2 py-1 rounded small">${new Date(r.createdAt).toLocaleDateString()}</small>
                        </div>
                        <p class="mb-0 text-secondary" style="line-height: 1.6;">${r.comment || '<i>Без комментария</i>'}</p>
                    </div>
                `).join('');
            }

            // Сообщения
            document.getElementById('msgBtn').onclick = () => {
                window.location.href = `/dm.html?userId=${u.id}`;
            };

        } catch (error) {
            console.error(error);
            document.getElementById('userName').innerHTML = '<span class="text-danger">Ошибка</span>';
            document.getElementById('reviewsList').innerHTML = '<div class="alert alert-danger">Не удалось загрузить данные профиля.</div>';
        }
    }

    loadUserProfile();

    // Темная тема
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
    }

    // ===== ЖАЛОБА =====
    document.addEventListener('change', (e) => {
        if (e.target.name === 'reportReason') {
            document.getElementById('otherDescriptionBlock').classList.toggle('d-none', e.target.value !== 'Другое');
        }
    });

    document.getElementById('reportModal')?.addEventListener('show.bs.modal', () => {
        document.querySelectorAll('input[name="reportReason"]').forEach(r => r.checked = false);
        document.getElementById('otherDescriptionBlock').classList.add('d-none');
        document.getElementById('otherDescription').value = '';
        document.getElementById('reportSuccess').classList.add('d-none');
        document.getElementById('reportError').classList.add('d-none');
        document.getElementById('reasonList').classList.remove('d-none');
        const btn = document.getElementById('submitReportBtn');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send me-1"></i> Отправить';
        btn.classList.remove('d-none');
    });

    document.getElementById('submitReportBtn')?.addEventListener('click', async () => {
        const selectedReason = document.querySelector('input[name="reportReason"]:checked');
        const errorEl = document.getElementById('reportError');
        const successEl = document.getElementById('reportSuccess');
        errorEl.classList.add('d-none');
        successEl.classList.add('d-none');

        if (!selectedReason) {
            errorEl.textContent = 'Пожалуйста, выберите причину жалобы';
            errorEl.classList.remove('d-none');
            return;
        }

        const reason = selectedReason.value;
        const description = document.getElementById('otherDescription').value.trim();

        if (reason === 'Другое' && !description) {
            errorEl.textContent = 'Пожалуйста, опишите причину подробнее';
            errorEl.classList.remove('d-none');
            return;
        }

        const btn = document.getElementById('submitReportBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Отправка...';

        try {
            const res = await fetch('/api/reports', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ reportedUserId: userId, reason, description })
            });
            const data = await res.json();
            if (res.ok) {
                successEl.textContent = data.message || 'Спасибо. Жалоба отправлена модератору.';
                successEl.classList.remove('d-none');
                document.getElementById('reasonList').classList.add('d-none');
                document.getElementById('otherDescriptionBlock').classList.add('d-none');
                btn.classList.add('d-none');
            } else {
                errorEl.textContent = data.message || 'Ошибка при отправке жалобы';
                errorEl.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-send me-1"></i> Отправить';
            }
        } catch (err) {
            errorEl.textContent = 'Ошибка соединения с сервером';
            errorEl.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-send me-1"></i> Отправить';
        }
    });
</script>

</body>
</html>
