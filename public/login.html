<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Find&Go</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/logo.png">
    <style>
        .spinner-border-sm {
    width: 1rem;
    height: 1rem;
    border-width: 0.2em;
}

@keyframes spinner-border {
    to { transform: rotate(360deg); }
}

.spinner-border {
    display: inline-block;
    animation: spinner-border 0.75s linear infinite;
}
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-10">
                <div class="card shadow border-0" style="border-radius: 24px;">
                    <div class="card-body p-5 text-center">
                        <img src="/img/logo.png" alt="Find&Go" width="64" height="64" class="mb-3">
                        <h3 class="fw-bold mb-2">Добро пожаловать в Find&Go</h3>
                        <p class="text-muted mb-4">Найдите компанию для любых мероприятий.</p>
                        
                        <a href="/api/auth/google" class="btn btn-outline-dark w-100 rounded-pill py-3 fw-bold mb-4 d-flex align-items-center justify-content-center gap-2">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" width="24" height="24">
                            Войти через Google
                        </a>

                        <!-- Fullscreen Loader -->
                        <div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1050; flex-direction: column; justify-content: center; align-items: center;">
                            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                            <h5 class="mt-3 fw-bold text-primary">Подключаем Google...</h5>
                        </div>

                        <div class="d-flex align-items-center mb-4">
                            <hr class="flex-grow-1">
                            <span class="mx-3 text-muted small text-uppercase">или</span>
                            <hr class="flex-grow-1">
                        </div>

                        <!-- Email form wrapper -->
                        <div id="emailAuthSection" style="display: none;">
                            <form id="loginForm" class="text-start">
                                <div class="mb-3">
                                    <label for="email" class="form-label small fw-bold text-muted">Email</label>
                                    <input type="email" class="form-control rounded-pill px-4" id="email" required>
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label small fw-bold text-muted">Пароль</label>
                                    <input type="password" class="form-control rounded-pill px-4" id="password" required>
                                </div>
                                <button type="submit" class="btn btn-outline-primary w-100 rounded-pill py-2 fw-bold">Войти по Email</button>
                            </form>
                            <div class="mt-3">
                                <a href="register.html" class="text-decoration-none small">Создать аккаунт</a>
                            </div>
                        </div>
                        
                        <button class="btn btn-light w-100 rounded-pill py-2 fw-bold" id="showEmailBtn" onclick="toggleEmailSection()">
                            Продолжить по Email
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function toggleEmailSection() {
            document.getElementById('emailAuthSection').style.display = 'block';
            document.getElementById('showEmailBtn').style.display = 'none';
        }

        // Check for oauth/telegram auth errors in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            const errorMsg = urlParams.get('error').replace(/\+/g, ' ');
            alert('Ошибка авторизации: ' + errorMsg);
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Вход...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.href = '/app.html';
                } else {
                    if (data.isBanned) {
                        let banMessage = `Ваш аккаунт заблокирован.\nПричина: ${data.banReason || 'Не указана'}\n`;
                        if (data.banUntil) {
                            banMessage += `Дата окончания блокировки: ${new Date(data.banUntil).toLocaleString('ru-RU')}`;
                        } else {
                            banMessage += `Дата окончания блокировки: Бессрочно`;
                        }
                        alert(banMessage);
                    } else {
                        alert(data.message);
                    }
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            } catch (error) {
                console.error(error);
                alert('Ошибка при входе');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
