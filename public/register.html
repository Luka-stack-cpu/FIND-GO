<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Find&Go</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/logo.png">
    <style>
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.2em;
        }

        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }

        .spinner-border {
            display: inline-block;
            animation: spinner-border 0.75s linear infinite;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-10">
                <div class="card shadow border-0" style="border-radius: 24px;">
                    <div class="card-body p-5 text-center">
                        <img src="/img/logo.png" alt="Find&Go" width="64" height="64" class="mb-3">
                        <h3 class="fw-bold mb-2">Создать аккаунт</h3>
                        <p class="text-muted mb-4">Найдите компанию для любых мероприятий.</p>

                        <a href="/api/auth/google" class="btn btn-outline-dark w-100 rounded-pill py-3 fw-bold mb-4 d-flex align-items-center justify-content-center gap-2">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" width="24" height="24">
                            Войти через Google
                        </a>

                        <!-- Fullscreen Loader -->
                        <div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1050; flex-direction: column; justify-content: center; align-items: center;">
                            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                            <h5 class="mt-3 fw-bold text-primary">Подключаем Google...</h5>
                        </div>

                        <div class="d-flex align-items-center mb-4">
                            <hr class="flex-grow-1">
                            <span class="mx-3 text-muted small text-uppercase">или</span>
                            <hr class="flex-grow-1">
                        </div>

                        <div id="errorAlert" class="alert alert-danger d-none text-start small" role="alert"></div>

                        <!-- Email form wrapper -->
                        <div id="emailAuthSection" style="display: none;">
                            <form id="registerForm" class="text-start">
                                <div class="mb-3">
                                    <label for="name" class="form-label small fw-bold text-muted">Имя</label>
                                    <input type="text" class="form-control rounded-pill px-4" id="name" required placeholder="Как к вам обращаться?">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label small fw-bold text-muted">Email</label>
                                    <input type="email" class="form-control rounded-pill px-4" id="email" required placeholder="name@example.com">
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted">Дата рождения <span class="text-danger">*</span></label>
                                    <div class="row g-2">
                                        <div class="col-4">
                                            <select class="form-select rounded-pill" id="birthDay" required>
                                                <option value="" disabled selected>День</option>
                                            </select>
                                        </div>
                                        <div class="col-4">
                                            <select class="form-select rounded-pill" id="birthMonth" required>
                                                <option value="" disabled selected>Месяц</option>
                                                <option value="1">Янв</option>
                                                <option value="2">Фев</option>
                                                <option value="3">Мар</option>
                                                <option value="4">Апр</option>
                                                <option value="5">Май</option>
                                                <option value="6">Июн</option>
                                                <option value="7">Июл</option>
                                                <option value="8">Авг</option>
                                                <option value="9">Сен</option>
                                                <option value="10">Окт</option>
                                                <option value="11">Ноя</option>
                                                <option value="12">Дек</option>
                                            </select>
                                        </div>
                                        <div class="col-4">
                                            <select class="form-select rounded-pill" id="birthYear" required>
                                                <option value="" disabled selected>Год</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-text text-muted small mt-1">Регистрация от 14 лет.</div>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label small fw-bold text-muted">Пароль</label>
                                    <input type="password" class="form-control rounded-pill px-4" id="password" required placeholder="Минимум 6 символов">
                                </div>
                                <button type="submit" id="submitBtn" class="btn btn-outline-primary w-100 rounded-pill py-2 fw-bold">Зарегистрироваться по Email</button>
                            </form>
                            <div class="mt-3 text-center">
                                <a href="login.html" class="text-decoration-none small">Уже есть аккаунт? Войти</a>
                            </div>
                        </div>

                        <button class="btn btn-light w-100 rounded-pill py-2 fw-bold" id="showEmailBtn" onclick="toggleEmailSection()">
                            Продолжить по Email
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleEmailSection() {
            document.getElementById('emailAuthSection').style.display = 'block';
            document.getElementById('showEmailBtn').style.display = 'none';
        }

        // Инициализация списков дней и годов
        const daySelect = document.getElementById('birthDay');
        for (let d = 1; d <= 31; d++) {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            daySelect.appendChild(opt);
        }

        const yearSelect = document.getElementById('birthYear');
        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 14; y >= 1920; y--) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');
            errorAlert.classList.add('d-none');

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const day = document.getElementById('birthDay').value;
            const month = document.getElementById('birthMonth').value;
            const year = document.getElementById('birthYear').value;

            if (!day || !month || !year) {
                errorAlert.textContent = 'Пожалуйста, выберите день, месяц и год рождения';
                errorAlert.classList.remove('d-none');
                return;
            }

            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Регистрация...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, day, month, year })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.href = '/app.html';
                } else {
                    errorAlert.textContent = data.message || 'Ошибка при регистрации';
                    errorAlert.classList.remove('d-none');
                }
            } catch (error) {
                console.error(error);
                errorAlert.textContent = 'Ошибка соединения с сервером';
                errorAlert.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
