<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | Find&Go</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/img/logo.png">
    <style>
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.2em;
        }

        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }

        .spinner-border {
            display: inline-block;
            animation: spinner-border 0.75s linear infinite;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Регистрация</h3>
                    </div>
                    <div class="card-body">
                        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="name" class="form-label">Имя</label>
                                <input type="text" class="form-control" id="name" required placeholder="Введите ваше имя">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                            </div>
                            
                            <!-- Дата рождения: день, месяц, год -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Дата рождения <span class="text-danger">*</span></label>
                                <div class="row g-2">
                                    <div class="col-4">
                                        <select class="form-select" id="birthDay" required>
                                            <option value="" disabled selected>День</option>
                                        </select>
                                    </div>
                                    <div class="col-4">
                                        <select class="form-select" id="birthMonth" required>
                                            <option value="" disabled selected>Месяц</option>
                                            <option value="1">Январь</option>
                                            <option value="2">Февраль</option>
                                            <option value="3">Март</option>
                                            <option value="4">Апрель</option>
                                            <option value="5">Май</option>
                                            <option value="6">Июнь</option>
                                            <option value="7">Июль</option>
                                            <option value="8">Август</option>
                                            <option value="9">Сентябрь</option>
                                            <option value="10">Октябрь</option>
                                            <option value="11">Ноябрь</option>
                                            <option value="12">Декабрь</option>
                                        </select>
                                    </div>
                                    <div class="col-4">
                                        <select class="form-select" id="birthYear" required>
                                            <option value="" disabled selected>Год</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-text text-muted small mt-1">
                                    Регистрация доступна для пользователей от 14 лет.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="password" required placeholder="Минимум 6 символов">
                            </div>
                            <button type="submit" id="submitBtn" class="btn btn-primary w-100">Зарегистрироваться</button>
                        </form>
                        
                        <div class="mt-3 text-center">
                            <a href="login.html">Уже есть аккаунт? Войти</a>
                        </div>
                        <div class="mt-3 text-center">
                            <hr>
                            <p class="text-muted small">Или войти через:</p>
                            <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="findgo_test_bot" data-size="large" data-auth-url="https://find-go.onrender.com/api/auth/telegram" data-request-access="write"></script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация списков дней и годов
        const daySelect = document.getElementById('birthDay');
        for (let d = 1; d <= 31; d++) {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            daySelect.appendChild(opt);
        }

        const yearSelect = document.getElementById('birthYear');
        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 14; y >= 1920; y--) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');
            errorAlert.classList.add('d-none');

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const day = document.getElementById('birthDay').value;
            const month = document.getElementById('birthMonth').value;
            const year = document.getElementById('birthYear').value;

            if (!day || !month || !year) {
                errorAlert.textContent = 'Пожалуйста, выберите день, месяц и год рождения';
                errorAlert.classList.remove('d-none');
                return;
            }

            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Регистрация...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, day, month, year })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.href = '/app.html';
                } else {
                    errorAlert.textContent = data.message || 'Ошибка при регистрации';
                    errorAlert.classList.remove('d-none');
                }
            } catch (error) {
                console.error(error);
                errorAlert.textContent = 'Ошибка соединения с сервером';
                errorAlert.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
